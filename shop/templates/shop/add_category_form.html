<!-- Modal for adding a new category -->
<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addCategoryModalLabel">Add New Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Form for adding a new category -->
          <form method="POST" action="{% url 'add_category' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
              <label for="categoryName" class="form-label">Name</label>
              <input type="text" class="form-control" id="categoryName" name="name" required />
            </div>

            <div class="mb-3">
              <label for="categoryDescription" class="form-label">Description</label>
              <textarea class="form-control" id="categoryDescription" name="description" rows="3" required></textarea>
            </div>

            <div class="form-group d-flex mb-3">
              <label for="categoryImage" class="me-4">Category Image:</label>
              <input type="file" class="form-control-file" id="categoryImage_add" name="category_image" accept="image/*" />
            </div>

            <!-- Add other fields as needed -->

            <button type="submit" class="btn btn-primary">Add Category</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </div>
