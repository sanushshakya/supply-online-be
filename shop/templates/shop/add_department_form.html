    <!-- Modal for adding a new department -->
    <div class="modal fade" id="addDepartmentModal" tabindex="-1" aria-labelledby="addDepartmentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="addDepartmentModalLabel">Add New Department</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!-- Form for adding a new department -->
              <form method="POST" action="{% url 'add_department' %}">
                {% csrf_token %}
  
                <div class="mb-3">
                  <label for="departmentName" class="form-label">Name</label>
                  <input type="text" class="form-control" id="departmentName" name="name" required />
                </div>
  
                <div class="mb-3">
                  <label for="departmentDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="departmentDescription" name="description" rows="3" required></textarea>
                </div>
  
                <!-- Add other fields as needed -->
  
                <button type="submit" class="btn btn-primary">Add Product Department</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              </form>
            </div>
          </div>
        </div>
      </div>
