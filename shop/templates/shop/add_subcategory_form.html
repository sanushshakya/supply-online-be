    <!-- Modal for adding a new sub-category -->
    <div class="modal fade" id="addSubCategoryModal" tabindex="-1" aria-labelledby="addSubCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="addSubCategoryModalLabel">Add New Sub-Category</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!-- Form for adding a new sub-category -->
              <form method="POST" action="{% url 'add_subcategory' %}">
                {% csrf_token %}
  
                <div class="mb-3">
                  <label for="subCategoryName" class="form-label">Name</label>
                  <input type="text" class="form-control" id="subCategoryName" name="name" required />
                </div>
  
                <div class="mb-3">
                  <label for="subCategoryDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="subCategoryDescription" name="description" rows="3" required></textarea>
                </div>
  
                <div class="mb-3">
                  <label for="associatedCategory" class="form-label">Associated Category</label>
                  <select class="form-select" id="associatedCategory" name="associated_category" required>
                    <option value="" disabled selected>Select Category</option>
                    {% for category in categories %}
                      <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                  </select>
                </div>
  
                <!-- Add other fields as needed -->
  
                <button type="submit" class="btn btn-primary">Add Sub-Category</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              </form>
            </div>
          </div>
        </div>
      </div>
