name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.11, Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENV: local
      SECRET_KEY: ci-only-secret-key-for-tests-0123456789-abcdef
      # Test against Postgres, as in production (the same suite also passes on SQLite)
      POSTGRESDB_NAME: m18
      POSTGRESDB_USER: m18
      POSTGRESDB_PASS: ci-only-password
      DB_HOST: localhost
      DB_PORT: 5432

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: m18
          POSTGRES_USER: m18
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m18 -d m18"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: System checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --noinput

  docker:
    name: Local Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Dockerfile.local
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.local
          load: true
          tags: m18:ci

      - name: Django system checks inside the image
        run: docker run --rm m18:ci python manage.py check
